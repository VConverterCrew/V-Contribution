const langSelect=document.getElementById('lang'),cards=document.getElementById('cards'),filter=document.getElementById('filter'),music=document.getElementById('music'),musicBtn=document.getElementById('musicBtn');let lang='en';try{lang=localStorage.getItem('vcontribution-language')||((navigator.language||'en').slice(0,2))}catch{}if(!translations[lang])lang='en';
function render(){const t=translations[lang];document.documentElement.lang=lang==='pt'?'pt-BR':lang;langSelect.value=lang;document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]||''});filter.placeholder=t.search;cards.replaceChildren();t.cards.forEach(([emoji,title,desc,url])=>{const article=document.createElement('article');article.className='card';article.dataset.search=(title+' '+desc).toLocaleLowerCase(lang);const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=emoji;const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=desc;const a=document.createElement('a');a.href=url;a.textContent=t.openGuide;if(url.startsWith('https://')){a.target='_blank';a.rel='noopener noreferrer'}article.append(symbol,h,p,a);cards.append(article)});const steps=document.getElementById('steps');steps.replaceChildren();t.steps.forEach(([title,desc],i)=>{const article=document.createElement('article');article.className='step';const number=document.createElement('span');number.className='step-number';number.textContent=i+1;const content=document.createElement('div');const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=desc;content.append(h,p);if(i===2||i===4){const code=document.createElement('div');code.className='codebox';const pre=document.createElement('code');pre.textContent=i===2?'git clone https://github.com/YOUR_USERNAME/V-Converter.git\ncd V-Converter\ngit checkout -b feat/my-improvement':'git add .\ngit commit -m "feat: my improvement"\ngit push -u origin feat/my-improvement';const btn=document.createElement('button');btn.type='button';btn.className='copy';btn.textContent=t.copy;btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(pre.textContent);btn.textContent=t.copied;setTimeout(()=>btn.textContent=translations[lang].copy,1700)}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(pre);selection.removeAllRanges();selection.addRange(range)}});code.append(pre,btn);content.append(code)}article.append(number,content);steps.append(article)});document.getElementById('checks').replaceChildren(...t.checks.map(s=>{const li=document.createElement('li');li.textContent=s;return li}));document.getElementById('faqs').replaceChildren(...t.faqs.map(([q,a])=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent=q;const p=document.createElement('p');p.textContent=a;d.append(s,p);return d}));applyFilter();updateMusic()}
function applyFilter(){const q=filter.value.trim().toLocaleLowerCase(lang);let shown=0;cards.querySelectorAll('.card').forEach(c=>{c.hidden=!c.dataset.search.includes(q);if(!c.hidden)shown++});document.getElementById('empty').hidden=shown!==0}filter.addEventListener('input',applyFilter);langSelect.addEventListener('change',()=>{lang=langSelect.value;try{localStorage.setItem('vcontribution-language',lang)}catch{}render()});
const gear=document.getElementById('gear'),panel=document.getElementById('settingsPanel');function closeSettings(){panel.hidden=true;gear.setAttribute('aria-expanded','false')}gear.addEventListener('click',()=>{panel.hidden=!panel.hidden;gear.setAttribute('aria-expanded',String(!panel.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.settings'))closeSettings()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});const mobileBtn=document.getElementById('mobileBtn'),navlinks=document.getElementById('navlinks');mobileBtn.addEventListener('click',()=>{const open=navlinks.classList.toggle('open');mobileBtn.setAttribute('aria-expanded',String(open))});navlinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navlinks.classList.remove('open');mobileBtn.setAttribute('aria-expanded','false')}));
function updateMusic(){musicBtn.textContent=music.paused?'♫':'❚❚';musicBtn.setAttribute('aria-pressed',String(!music.paused));musicBtn.setAttribute('aria-label',translations[lang][music.paused?'musicOff':'musicOn']);musicBtn.title=musicBtn.getAttribute('aria-label')}musicBtn.addEventListener('click',async()=>{if(music.paused){try{await music.play()}catch{musicBtn.title='Unable to play audio'}}else music.pause();updateMusic()});music.addEventListener('play',updateMusic);music.addEventListener('pause',updateMusic);window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;document.getElementById('progress').style.width=(max>0?scrollY/max*100:0)+'%'},{passive:true});document.getElementById('year').textContent=new Date().getFullYear();render();
</script>

<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f23"><meta name="description" content="V-Converter art contribution guide"><title>Art · V-Contribution</title><style>@font-face{font-family:Funkin;src:url('../assets/fonts/funkin.ttf') format('truetype');font-display:swap} :root{color-scheme:dark;--bg:#080f23;--panel:#101d38;--panel2:#15284b;--text:#edf5ff;--muted:#a6b8d5;--blue:#58a6ff;--border:#29456b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#143b77 0%,transparent 40%),var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}h1,h2,h3,.brand,.button,.pill{font-family:Funkin,system-ui,sans-serif;letter-spacing:.025em}a{color:var(--blue)}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#080f23ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}.brand{text-decoration:none;color:white;font-size:1.35rem}.brand span{color:var(--blue)}.links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.links a{text-decoration:none;color:var(--muted);font-size:.92rem}.links a:hover{color:var(--blue)}.settings{position:relative}.gear{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:white;border-radius:12px;padding:9px 12px;font-size:1.3rem;line-height:1}.menu{position:absolute;right:0;top:calc(100% + 10px);width:220px;background:#142748;border:1px solid #416aa3;box-shadow:0 15px 40px #0008;border-radius:14px;padding:15px}.menu[hidden]{display:none}.menu label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:8px}.menu select{width:100%;padding:10px;background:#0a1730;color:white;border:1px solid #416aa3;border-radius:9px}.hero{padding:96px 0 65px;text-align:center}.pill{display:inline-block;background:#173665;border:1px solid #376fbd;color:#9bcbff;border-radius:50px;padding:6px 17px;font-size:.82rem}.hero h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.15;margin:22px auto;max-width:850px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:680px;margin:0 auto 30px;color:var(--muted);font-size:1.1rem}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--blue);border-radius:13px;padding:12px 20px;text-decoration:none;background:var(--blue);color:#07162d;font-size:1rem;transition:transform .2s}.button:hover{transform:translateY(-2px)}.button.secondary{background:transparent;color:var(--blue)}section{padding:40px 0;scroll-margin-top:95px}h2{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.3;margin:0 0 10px}.lead{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.step,.callout{background:linear-gradient(145deg,var(--panel),#0c1930);border:1px solid var(--border);border-radius:18px;padding:24px}.card h3,.step h3{margin:8px 0;font-size:1.2rem}.card p,.step p{color:var(--muted);margin:0}.symbol{font-size:1.8rem}.steps{display:grid;gap:16px}.step{display:grid;grid-template-columns:48px 1fr;gap:16px}.number{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#1a447d;color:#a9d2ff;font:1.4rem Funkin,system-ui}.step h3{margin-top:0}.code{position:relative;background:#060d1c;border:1px solid #36527c;border-radius:12px;padding:16px;overflow:auto;margin-top:13px}.code code{white-space:pre;font:14px/1.6 ui-monospace,Consolas,monospace;color:#cbe4ff}.copy{position:absolute;right:8px;top:8px;border:1px solid #426eae;background:#193961;color:white;border-radius:8px;padding:5px 10px;cursor:pointer}.callout strong{color:var(--blue)}.checklist{padding-left:22px;color:var(--muted)}.checklist li{margin:9px 0}.footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);text-align:center}.footer a{margin:0 7px}::selection{background:#3568a7;color:white}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.doc{padding-top:55px}.doc article{margin-bottom:20px}.doc p,.doc li{color:var(--muted)}.doc pre{overflow:auto}.doc h2{font-size:1.65rem}@media(max-width:760px){.nav{align-items:flex-start}.links{gap:12px}.hero{padding:65px 0 35px}.grid{grid-template-columns:1fr}.step{grid-template-columns:38px 1fr;padding:18px}.number{width:35px;height:35px}.links a{font-size:.82rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.doc-card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:24px}.doc-card h2{font-size:1.3rem}.doc-card p{color:var(--muted)}.doc-list{padding-left:24px;color:var(--muted)}.doc-list li{margin:10px 0}.doc-hero{padding:68px 0 25px}.doc-hero h1{font-size:clamp(2.3rem,6vw,4.2rem);margin:14px 0}.doc-hero p{max-width:730px;color:var(--muted)}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em}.note{background:#132b4c;border-left:4px solid var(--blue);padding:16px 20px;border-radius:8px;color:var(--muted)}@media(max-width:760px){.doc-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><nav class="wrap nav" aria-label="Navigation"><a class="brand" href="../index.html">V <span>Contribution</span></a><div class="links"><a data-i18n="home" href="../index.html"></a><a data-i18n="programming" href="programming.html"></a><a data-i18n="playtesting" href="playtesting.html"></a><a data-i18n="reporting" href="reporting.html"></a><a data-i18n="arting" href="arting.html" aria-current="page"></a><div class="settings"><button type="button" class="gear" id="gear" aria-label="Language settings" aria-expanded="false" aria-controls="settings-menu">⚙</button><div class="menu" id="settings-menu" hidden><label data-i18n="language" for="language"></label><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select></div></div></div></nav></header><main class="wrap"><div class="doc-hero"><span class="eyebrow" data-i18n="tag"></span><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div><div class="doc-grid" id="sections"></div><section><div class="note" data-i18n="note"></div><div class="actions" style="margin-top:24px"><a class="button" data-i18n="cta" href="https://github.com/VConverterCrew/V-Converter/issues"></a><a class="button secondary" data-i18n="discord" href="https://discord.gg/gYrQvGYXCY" target="_blank" rel="noopener noreferrer"></a></div></section></main><footer class="footer"><a data-i18n="home" href="../index.html"></a> · <a href="https://github.com/VConverterCrew/V-Converter">V-Converter</a> · <a href="https://github.com/VConverterCrew/V-Contribution">V-Contribution</a></footer><script>const translations={"pt": {"tag": "GUIA DE ARTE", "title": "Contribua com arte", "intro": "Ajude a melhorar a identidade visual do V-Converter com ícones, ilustrações, layouts e recursos gráficos.", "sections": [["1. Escolha uma contribuição", ["Confira as Issues e propostas existentes antes de começar.", "Você pode contribuir com ícones, ilustrações, telas, banners e melhorias de acessibilidade visual.", "Prefira trabalhar em uma tarefa pequena e com objetivo claro."]], ["2. Prepare os arquivos", ["Use arquivos originais ou recursos com licença compatível e permissão de uso.", "Mantenha o arquivo editável quando possível (por exemplo, SVG ou projeto de design).", "Exporte imagens em dimensões adequadas e otimize o tamanho sem perder qualidade.", "Use nomes de arquivos claros e consistentes."]], ["3. Respeite a interface", ["Siga as cores e a linguagem visual existentes no projeto, salvo quando a proposta for mudar o estilo.", "Verifique contraste, legibilidade e tamanhos de toque em telas pequenas.", "Confira a aparência em temas, resoluções e plataformas diferentes quando aplicável."]], ["4. Envie sua arte", ["Faça um fork do repositório correto e crie uma branch para sua contribuição.", "Inclua prévias antes/depois, descrição das mudanças e arquivos-fonte.", "Abra um Pull Request ou uma Issue para discutir a proposta com a equipe.", "Esteja disponível para ajustes após o feedback."]]], "note": "Importante: não envie artes de terceiros sem autorização. Informe a autoria, a origem e a licença dos recursos usados.", "cta": "Ver Issues", "home": "Início", "programming": "Programação", "playtesting": "Testes", "reporting": "Reportar bugs", "arting": "Arte", "language": "Idioma", "discord": "Entrar no Discord"}, "en": {"tag": "ART CONTRIBUTION GUIDE", "title": "Contribute artwork", "intro": "Help improve V-Converter’s visual identity with icons, illustrations, layouts, and graphic assets.", "sections": [["1. Pick a contribution", ["Check existing Issues and proposals before starting.", "You can contribute icons, illustrations, screens, banners, and visual accessibility improvements.", "Start with a small task with a clear goal."]], ["2. Prepare your assets", ["Use original artwork or assets with compatible licenses and permission to use.", "Keep editable source files when possible (such as SVG or a design project).", "Export images at suitable sizes and optimize file size without losing quality.", "Use clear, consistent file names."]], ["3. Respect the interface", ["Follow the project’s existing colors and visual language unless proposing a redesign.", "Check contrast, readability, and touch target sizes on small screens.", "Review different themes, resolutions, and platforms where applicable."]], ["4. Submit your artwork", ["Fork the appropriate repository and create a branch for your contribution.", "Include before/after previews, a description, and source assets.", "Open a Pull Request or Issue to discuss your proposal with the team.", "Be ready to make changes after feedback."]]], "note": "Important: do not submit third-party artwork without permission. Credit the creator and identify the source and license of any assets used.", "cta": "View Issues", "home": "Home", "programming": "Programming", "playtesting": "Playtesting", "reporting": "Report bugs", "arting": "Art", "language": "Language", "discord": "Join Discord"}, "es": {"tag": "GUÍA DE ARTE", "title": "Contribuye con arte", "intro": "Ayuda a mejorar la identidad visual de V-Converter con iconos, ilustraciones, diseños y recursos gráficos.", "sections": [["1. Elige una contribución", ["Revisa las Issues y propuestas existentes antes de empezar.", "Puedes contribuir con iconos, ilustraciones, pantallas, banners y mejoras de accesibilidad visual.", "Empieza con una tarea pequeña y un objetivo claro."]], ["2. Prepara los archivos", ["Usa arte original o recursos con licencias compatibles y permiso de uso.", "Conserva los archivos editables cuando sea posible (por ejemplo, SVG o proyecto de diseño).", "Exporta imágenes con dimensiones adecuadas y optimiza el tamaño sin perder calidad.", "Usa nombres de archivo claros y coherentes."]], ["3. Respeta la interfaz", ["Sigue los colores y el lenguaje visual del proyecto, salvo que propongas un rediseño.", "Comprueba el contraste, la legibilidad y el tamaño de los controles táctiles.", "Revisa distintos temas, resoluciones y plataformas cuando corresponda."]], ["4. Envía tu arte", ["Haz un fork del repositorio adecuado y crea una rama para tu contribución.", "Incluye vistas previas de antes y después, una descripción y archivos fuente.", "Abre un Pull Request o una Issue para discutir la propuesta con el equipo.", "Prepárate para realizar cambios después de recibir comentarios."]]], "note": "Importante: no envíes obras de terceros sin permiso. Indica el autor, el origen y la licencia de los recursos utilizados.", "cta": "Ver Issues", "home": "Inicio", "programming": "Programación", "playtesting": "Pruebas", "reporting": "Reportar errores", "arting": "Arte", "language": "Idioma", "discord": "Unirse a Discord"}};const selector=document.querySelector('#language'),gear=document.querySelector('#gear'),menu=document.querySelector('#settings-menu');function setLanguage(lang){if(!translations[lang])lang='pt';selector.value=lang;document.documentElement.lang=lang==='pt'?'pt-BR':lang;const dict=translations[lang];document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=dict[el.dataset.i18n]||'');const area=document.querySelector('#sections');area.replaceChildren();dict.sections.forEach(([heading,items])=>{const article=document.createElement('article');article.className='doc-card';const h=document.createElement('h2');h.textContent=heading;const ul=document.createElement('ul');ul.className='doc-list';items.forEach(item=>{const li=document.createElement('li');li.textContent=item;ul.append(li)});article.append(h,ul);area.append(article)});try{localStorage.setItem('vcontribution-language',lang)}catch{}}gear.addEventListener('click',()=>{menu.hidden=!menu.hidden;gear.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',event=>{if(!event.target.closest('.settings')){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});selector.addEventListener('change',()=>setLanguage(selector.value));let saved;try{saved=localStorage.getItem('vcontribution-language')}catch{}setLanguage(saved||((navigator.language||'pt').slice(0,2)));</script></body></html>

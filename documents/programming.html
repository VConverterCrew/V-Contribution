:30px 0;color:var(--muted);text-align:center}.footer a{margin:0 7px}::selection{background:#3568a7;color:white}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.doc{padding-top:55px}.doc article{margin-bottom:20px}.doc p,.doc li{color:var(--muted)}.doc pre{overflow:auto}.doc h2{font-size:1.65rem}@media(max-width:760px){.nav{align-items:flex-start}.links{gap:12px}.hero{padding:65px 0 35px}.grid{grid-template-columns:1fr}.step{grid-template-columns:38px 1fr;padding:18px}.number{width:35px;height:35px}.links a{font-size:.82rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}</style></head><body><header class="top"><nav class="wrap nav" aria-label="Navigation"><a class="brand" href="../index.html">V<span>Contribution</span></a><div class="links"><a href="../index.html#formas" data-i18n="nav1"></a><a href="../index.html#passos" data-i18n="nav2"></a><a href="../index.html#regras" data-i18n="nav3"></a><a href="../documents/programming.html" data-i18n="nav4"></a><div class="settings"><button id="gear" class="gear" type="button" aria-label="Settings / Configurações" aria-controls="settings-menu" aria-expanded="false">⚙</button><div class="menu" id="settings-menu" hidden><label for="language" data-i18n="language"></label><select id="language"><option value="pt">Português</option><option value="en">English</option></select></div></div></div></nav></header><main class="wrap doc"><span class="pill">V-CONVERTER / DOCS</span><h1 data-i18n="docTitle"></h1><p class="lead" data-i18n="docIntro"></p><article class="card" data-doc-section="0"><h2></h2><p></p></article><article class="card" data-doc-section="1"><h2></h2><p></p></article><article class="card" data-doc-section="2"><h2></h2><p></p></article><article class="card" data-doc-section="3"><h2></h2><p></p></article><article class="card" data-doc-section="4"><h2></h2><p></p></article><article class="card"><h2>Git</h2><div class="code"><button class="copy" type="button"></button><code>git clone https://github.com/YOUR_USERNAME/V-Converter.git
cd V-Converter
git checkout -b fix/my-fix
git add .
git commit -m "fix: describe the change"
git push -u origin fix/my-fix</code></div></article><div class="actions"><a class="button" href="../index.html" data-i18n="back"></a><a class="button secondary" href="https://github.com/VConverterCrew/V-Converter">GitHub ↗</a></div></main><footer class="footer"><div class="wrap"><span data-i18n="footer"></span> · <a href="https://github.com/VConverterCrew/V-Converter">V-Converter</a> · <a href="https://github.com/VConverterCrew/V-Contribution">V-Contribution</a></div></footer><script>const translations={"pt": {"nav1": "Contribuir", "nav2": "Passo a passo", "nav3": "Boas práticas", "nav4": "Programação", "language": "Idioma", "pill": "OPEN SOURCE • COMUNIDADE", "title": "Faça parte do futuro do <em>V-Converter!</em>", "intro": "Ajude a corrigir bugs, melhorar traduções e desenvolver recursos. Aprenda a contribuir mesmo que seja sua primeira vez no GitHub.", "start": "Começar agora", "repo": "Ver projeto no GitHub", "ways": "Como você pode ajudar?", "wayslead": "Escolha uma forma de contribuir com a comunidade.", "cards": [["💻", "Código", "Implemente melhorias e corrija problemas."], ["🌍", "Traduções", "Ajude a traduzir a interface."], ["🐛", "Bugs", "Descreva problemas e como reproduzi-los."], ["📚", "Documentação", "Melhore guias e exemplos."], ["🧪", "Testes", "Teste mudanças em diferentes plataformas."], ["💡", "Ideias", "Sugira recursos e melhorias."]], "pr": "Seu primeiro Pull Request", "prlead": "Seis etapas para enviar uma contribuição.", "steps": [["Encontre uma tarefa", "Procure Issues existentes antes de começar."], ["Faça um Fork", "Crie uma cópia do repositório na sua conta."], ["Clone e crie uma branch", "Troque SEU_USUARIO pelo seu nome de usuário."], ["Edite e teste", "Mantenha suas mudanças focadas e teste o que for possível."], ["Envie suas alterações", "Faça commit e push para seu fork."], ["Abra um Pull Request", "Descreva as mudanças e aguarde a revisão da equipe."]], "practices": "Boas práticas", "practicelead": "Antes de enviar sua contribuição:", "checks": ["Pesquise Issues e PRs semelhantes.", "Explique o que mudou e por quê.", "Evite mudanças não relacionadas no mesmo PR.", "Teste e informe as plataformas verificadas.", "Inclua imagens para mudanças visuais.", "Respeite as revisões e as regras do projeto."], "docs": "Documentação de programação", "docsdesc": "Veja como organizar alterações de código, trabalhar com branches e preparar um PR.", "docsbtn": "Ler documentação", "footer": "Guia comunitário do V-Converter", "copy": "Copiar", "copied": "Copiado!", "docTitle": "Guia de programação", "docIntro": "Orientações para contribuir com o código do V-Converter. Confira sempre as instruções atualizadas no repositório principal.", "sections": [["Antes de começar", "Verifique o README, as Issues abertas e os requisitos de desenvolvimento. Para mudanças grandes, discuta sua proposta antes de programar."], ["Prepare o ambiente", "Faça um fork, clone seu repositório e crie uma branch com um nome descritivo."], ["Trabalhe com o código", "Siga a organização e o estilo já existentes. Evite mudanças fora do escopo do seu Pull Request."], ["Teste suas mudanças", "Execute os comandos de build e teste documentados no projeto. Informe quais plataformas foram verificadas e quais não puderam ser testadas."], ["Envie seu Pull Request", "Faça commit, push e abra um PR para a branch apropriada. Explique o comportamento anterior, o novo comportamento e os testes realizados."]], "back": "Voltar ao início"}, "en": {"nav1": "Contribute", "nav2": "Step by step", "nav3": "Best practices", "nav4": "Programming", "language": "Language", "pill": "OPEN SOURCE • COMMUNITY", "title": "Be part of the future of <em>V-Converter!</em>", "intro": "Help fix bugs, improve translations, and build features. Learn to contribute even if this is your first time on GitHub.", "start": "Get started", "repo": "View project on GitHub", "ways": "How can you help?", "wayslead": "Choose a way to support the community.", "cards": [["💻", "Code", "Implement improvements and fix issues."], ["🌍", "Translations", "Help translate the interface."], ["🐛", "Bug reports", "Describe issues and steps to reproduce."], ["📚", "Documentation", "Improve guides and examples."], ["🧪", "Testing", "Test changes across platforms."], ["💡", "Ideas", "Suggest features and improvements."]], "pr": "Your first Pull Request", "prlead": "Six steps to submit a contribution.", "steps": [["Find a task", "Check existing Issues before you start."], ["Fork the project", "Create a copy of the repository in your account."], ["Clone and create a branch", "Replace YOUR_USERNAME with your GitHub username."], ["Edit and test", "Keep changes focused and test what you can."], ["Push your changes", "Commit and push to your fork."], ["Open a Pull Request", "Describe your changes and wait for maintainer review."]], "practices": "Best practices", "practicelead": "Before submitting your contribution:", "checks": ["Search for similar Issues and PRs.", "Explain what changed and why.", "Avoid unrelated changes in one PR.", "Test and list the platforms you checked.", "Include screenshots for visual changes.", "Respect reviews and project guidelines."], "docs": "Programming documentation", "docsdesc": "Learn how to organize code changes, work with branches, and prepare a PR.", "docsbtn": "Read documentation", "footer": "V-Converter community guide", "copy": "Copy", "copied": "Copied!", "docTitle": "Programming guide", "docIntro": "Guidance for contributing code to V-Converter. Always check the main repository for up-to-date instructions.", "sections": [["Before you start", "Read the README, open Issues, and development requirements. Discuss larger changes before writing code."], ["Set up your environment", "Fork the repository, clone your copy, and create a descriptively named branch."], ["Work on the code", "Follow the existing project structure and coding style. Avoid unrelated changes."], ["Test your changes", "Run the build and test commands documented by the project. List tested and untested platforms."], ["Submit your Pull Request", "Commit, push, and open a PR against the appropriate branch. Explain the old and new behavior and your testing."]], "back": "Back to home"}};const selected=localStorage.getItem('vcontribution-language')||((navigator.language||'pt').toLowerCase().startsWith('pt')?'pt':'en');const select=document.querySelector('#language');const gear=document.querySelector('#gear');const menu=document.querySelector('#settings-menu');gear.addEventListener('click',()=>{menu.hidden=!menu.hidden;gear.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.settings')){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});function translate(lang){document.documentElement.lang=lang==='pt'?'pt-BR':'en';select.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;const value=translations[lang][key];if(value!==undefined)el.textContent=value});document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=translations[lang][el.dataset.i18nHtml]);document.querySelectorAll('[data-card]').forEach((el,i)=>{const item=translations[lang].cards[i];el.querySelector('.symbol').textContent=item[0];el.querySelector('h3').textContent=item[1];el.querySelector('p').textContent=item[2]});document.querySelectorAll('[data-step]').forEach((el,i)=>{const item=translations[lang].steps[i];el.querySelector('h3').textContent=item[0];el.querySelector('p').textContent=item[1]});document.querySelectorAll('[data-check]').forEach((el,i)=>el.textContent=translations[lang].checks[i]);document.querySelectorAll('[data-doc-section]').forEach((el,i)=>{el.querySelector('h2').textContent=translations[lang].sections[i][0];el.querySelector('p').textContent=translations[lang].sections[i][1]});document.querySelectorAll('.copy').forEach(el=>el.textContent=translations[lang].copy);localStorage.setItem('vcontribution-language',lang)}select.addEventListener('change',()=>translate(select.value));translate(['pt','en'].includes(selected)?selected:'pt');document.querySelectorAll('.copy').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(btn.parentElement.querySelector('code').textContent);btn.textContent=translations[select.value].copied;setTimeout(()=>btn.textContent=translations[select.value].copy,1500)}catch{btn.textContent='Select text / Selecione o texto'}}));</script></body></html>

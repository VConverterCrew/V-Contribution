<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#080f23" name="theme-color"/><title>V-Contribution</title><style>@font-face{font-family:Funkin;src:url('../assets/fonts/funkin.ttf') format('truetype');font-display:swap} :root{color-scheme:dark;--bg:#080f23;--panel:#101d38;--panel2:#15284b;--text:#edf5ff;--muted:#a6b8d5;--blue:#58a6ff;--border:#29456b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#143b77 0%,transparent 40%),var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}h1,h2,h3,.brand,.button,.pill{font-family:Funkin,system-ui,sans-serif;letter-spacing:.025em}a{color:var(--blue)}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#080f23ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}.brand{text-decoration:none;color:white;font-size:1.35rem}.brand span{color:var(--blue)}.links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.links a{text-decoration:none;color:var(--muted);font-size:.92rem}.links a:hover{color:var(--blue)}.settings{position:relative}.gear{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:white;border-radius:12px;padding:9px 12px;font-size:1.3rem;line-height:1}.menu{position:absolute;right:0;top:calc(100% + 10px);width:220px;background:#142748;border:1px solid #416aa3;box-shadow:0 15px 40px #0008;border-radius:14px;padding:15px}.menu[hidden]{display:none}.menu label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:8px}.menu select{width:100%;padding:10px;background:#0a1730;color:white;border:1px solid #416aa3;border-radius:9px}.hero{padding:96px 0 65px;text-align:center}.pill{display:inline-block;background:#173665;border:1px solid #376fbd;color:#9bcbff;border-radius:50px;padding:6px 17px;font-size:.82rem}.hero h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.15;margin:22px auto;max-width:850px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:680px;margin:0 auto 30px;color:var(--muted);font-size:1.1rem}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--blue);border-radius:13px;padding:12px 20px;text-decoration:none;background:var(--blue);color:#07162d;font-size:1rem;transition:transform .2s}.button:hover{transform:translateY(-2px)}.button.secondary{background:transparent;color:var(--blue)}section{padding:40px 0;scroll-margin-top:95px}h2{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.3;margin:0 0 10px}.lead{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.step,.callout{background:linear-gradient(145deg,var(--panel),#0c1930);border:1px solid var(--border);border-radius:18px;padding:24px}.card h3,.step h3{margin:8px 0;font-size:1.2rem}.card p,.step p{color:var(--muted);margin:0}.symbol{font-size:1.8rem}.steps{display:grid;gap:16px}.step{display:grid;grid-template-columns:48px 1fr;gap:16px}.number{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#1a447d;color:#a9d2ff;font:1.4rem Funkin,system-ui}.step h3{margin-top:0}.code{position:relative;background:#060d1c;border:1px solid #36527c;border-radius:12px;padding:16px;overflow:auto;margin-top:13px}.code code{white-space:pre;font:14px/1.6 ui-monospace,Consolas,monospace;color:#cbe4ff}.copy{position:absolute;right:8px;top:8px;border:1px solid #426eae;background:#193961;color:white;border-radius:8px;padding:5px 10px;cursor:pointer}.callout strong{color:var(--blue)}.checklist{padding-left:22px;color:var(--muted)}.checklist li{margin:9px 0}.footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);text-align:center}.footer a{margin:0 7px}::selection{background:#3568a7;color:white}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.doc{padding-top:55px}.doc article{margin-bottom:20px}.doc p,.doc li{color:var(--muted)}.doc pre{overflow:auto}.doc h2{font-size:1.65rem}@media(max-width:760px){.nav{align-items:flex-start}.links{gap:12px}.hero{padding:65px 0 35px}.grid{grid-template-columns:1fr}.step{grid-template-columns:38px 1fr;padding:18px}.number{width:35px;height:35px}.links a{font-size:.82rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.doc-card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:24px}.doc-card h2{font-size:1.3rem}.doc-card p{color:var(--muted)}.doc-list{padding-left:24px;color:var(--muted)}.doc-list li{margin:10px 0}.doc-hero{padding:68px 0 25px}.doc-hero h1{font-size:clamp(2.3rem,6vw,4.2rem);margin:14px 0}.doc-hero p{max-width:730px;color:var(--muted)}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em}.note{background:#132b4c;border-left:4px solid var(--blue);padding:16px 20px;border-radius:8px;color:var(--muted)}@media(max-width:760px){.doc-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><nav aria-label="Navigation" class="wrap nav"><a class="brand" href="../index.html">V <span>Contribution</span></a><div class="links"><a data-i18n="home" href="../index.html"></a><a data-i18n="programming" href="programming.html"></a><a data-i18n="playtesting" href="playtesting.html"></a><a data-i18n="reporting" href="reporting.html"></a><div class="settings"><button aria-controls="settings-menu" aria-expanded="false" aria-label="Language settings" class="gear" id="gear" type="button">⚙</button><div class="menu" hidden="" id="settings-menu"><label data-i18n="language" for="language"></label><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select></div></div></div></nav></header><main class="wrap"><div class="doc-hero"><span class="eyebrow" data-i18n="tag"></span><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div><div class="doc-grid" id="sections"></div><section><div class="note" data-i18n="note"></div><p style="margin-top:24px"><a class="button" data-i18n="cta" href="https://github.com/VConverterCrew/V-Converter/issues/new" id="cta"></a></p></section></main><footer class="footer"><a data-i18n="home" href="../index.html"></a> · <a href="https://github.com/VConverterCrew/V-Converter">V-Converter</a> · <a href="https://github.com/VConverterCrew/V-Contribution">V-Contribution</a></footer><script>const translations={"pt": {"tag": "GUIA DE REPORTES", "title": "Reporte um problema", "intro": "Um bom relatório permite que outras pessoas reproduzam e corrijam um bug mais rapidamente.", "sections": [["1. Antes de abrir uma Issue", ["Pesquise se o problema já foi relatado.", "Confira se você consegue reproduzi-lo na versão utilizada.", "Remova dados pessoais de imagens, arquivos e logs."]], ["2. Descreva o bug", ["Use um título curto e específico.", "Informe versão/build, sistema operacional e dispositivo.", "Liste os passos para reproduzir, em ordem.", "Explique o resultado esperado e o resultado real."]], ["3. Adicione evidências", ["Inclua capturas, vídeo curto ou mensagens de erro quando úteis.", "Se for um problema de conversão, descreva o formato de entrada e saída.", "Anexe somente arquivos que você tem permissão para compartilhar."]], ["4. Acompanhe a Issue", ["Responda a perguntas de quem mantém o projeto.", "Informe se o bug continua após uma atualização.", "Evite abrir várias Issues para o mesmo problema."]]], "note": "Modelo: Título → Ambiente → Passos → Esperado → Obtido → Evidências.", "cta": "Criar Issue", "home": "Início", "programming": "Programação", "playtesting": "Playtesting", "reporting": "Reportar bugs", "language": "Idioma"}, "en": {"tag": "BUG REPORTING GUIDE", "title": "Report an issue", "intro": "A good report helps others reproduce and fix a bug faster.", "sections": [["1. Before opening an Issue", ["Search for existing reports of the same problem.", "Confirm you can reproduce it in the version you used.", "Remove personal data from images, files, and logs."]], ["2. Describe the bug", ["Use a short, specific title.", "Include version/build, operating system, and device.", "List reproduction steps in order.", "Explain expected and actual results."]], ["3. Provide evidence", ["Add screenshots, a short video, or error messages when useful.", "For conversion issues, describe input and output formats.", "Only attach files you are allowed to share."]], ["4. Follow up", ["Answer maintainers’ questions.", "Say whether the issue persists after an update.", "Avoid duplicate Issues for the same problem."]]], "note": "Template: Title → Environment → Steps → Expected → Actual → Evidence.", "cta": "Create Issue", "home": "Home", "programming": "Programming", "playtesting": "Playtesting", "reporting": "Report bugs", "language": "Language"}, "es": {"tag": "GUÍA DE INFORMES", "title": "Reporta un problema", "intro": "Un buen informe ayuda a otras personas a reproducir y corregir un error más rápido.", "sections": [["1. Antes de abrir una Issue", ["Busca informes existentes del mismo problema.", "Confirma que puedes reproducirlo en la versión utilizada.", "Elimina datos personales de imágenes, archivos y registros."]], ["2. Describe el error", ["Usa un título corto y específico.", "Indica versión/compilación, sistema operativo y dispositivo.", "Enumera los pasos para reproducirlo.", "Explica el resultado esperado y el resultado real."]], ["3. Añade pruebas", ["Incluye capturas, un video corto o mensajes de error si ayudan.", "Para errores de conversión, describe los formatos de entrada y salida.", "Adjunta solo archivos que puedas compartir."]], ["4. Haz seguimiento", ["Responde a las preguntas de los mantenedores.", "Indica si el error persiste tras una actualización.", "Evita Issues duplicadas para el mismo problema."]]], "note": "Plantilla: Título → Entorno → Pasos → Esperado → Real → Evidencias.", "cta": "Crear Issue", "home": "Inicio", "programming": "Programación", "playtesting": "Pruebas", "reporting": "Reportar errores", "language": "Idioma"}};
const selector=document.querySelector('#language'),gear=document.querySelector('#gear'),menu=document.querySelector('#settings-menu');
function setLanguage(lang){if(!translations[lang])lang='pt';selector.value=lang;document.documentElement.lang=lang==='pt'?'pt-BR':lang;const dict=translations[lang];document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=dict[el.dataset.i18n]||'');const area=document.querySelector('#sections');area.replaceChildren();dict.sections.forEach(([heading,items])=>{const article=document.createElement('article');article.className='doc-card';const h=document.createElement('h2');h.textContent=heading;const ul=document.createElement('ul');ul.className='doc-list';items.forEach(item=>{const li=document.createElement('li');li.textContent=item;ul.append(li)});article.append(h,ul);area.append(article)});try{localStorage.setItem('vcontribution-language',lang)}catch{}}
gear.addEventListener('click',()=>{menu.hidden=!menu.hidden;gear.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',event=>{if(!event.target.closest('.settings')){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});selector.addEventListener('change',()=>setLanguage(selector.value));let saved;try{saved=localStorage.getItem('vcontribution-language')}catch{}setLanguage(saved||((navigator.language||'pt').slice(0,2)));</script></body></html>

<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#080f23" name="theme-color"/><title>V-Contribution</title><style>@font-face{font-family:Funkin;src:url('../assets/fonts/funkin.ttf') format('truetype');font-display:swap} :root{color-scheme:dark;--bg:#080f23;--panel:#101d38;--panel2:#15284b;--text:#edf5ff;--muted:#a6b8d5;--blue:#58a6ff;--border:#29456b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#143b77 0%,transparent 40%),var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}h1,h2,h3,.brand,.button,.pill{font-family:Funkin,system-ui,sans-serif;letter-spacing:.025em}a{color:var(--blue)}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#080f23ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 0}.brand{text-decoration:none;color:white;font-size:1.35rem}.brand span{color:var(--blue)}.links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.links a{text-decoration:none;color:var(--muted);font-size:.92rem}.links a:hover{color:var(--blue)}.settings{position:relative}.gear{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:white;border-radius:12px;padding:9px 12px;font-size:1.3rem;line-height:1}.menu{position:absolute;right:0;top:calc(100% + 10px);width:220px;background:#142748;border:1px solid #416aa3;box-shadow:0 15px 40px #0008;border-radius:14px;padding:15px}.menu[hidden]{display:none}.menu label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:8px}.menu select{width:100%;padding:10px;background:#0a1730;color:white;border:1px solid #416aa3;border-radius:9px}.hero{padding:96px 0 65px;text-align:center}.pill{display:inline-block;background:#173665;border:1px solid #376fbd;color:#9bcbff;border-radius:50px;padding:6px 17px;font-size:.82rem}.hero h1{font-size:clamp(2.5rem,7vw,5rem);line-height:1.15;margin:22px auto;max-width:850px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:680px;margin:0 auto 30px;color:var(--muted);font-size:1.1rem}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--blue);border-radius:13px;padding:12px 20px;text-decoration:none;background:var(--blue);color:#07162d;font-size:1rem;transition:transform .2s}.button:hover{transform:translateY(-2px)}.button.secondary{background:transparent;color:var(--blue)}section{padding:40px 0;scroll-margin-top:95px}h2{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.3;margin:0 0 10px}.lead{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.step,.callout{background:linear-gradient(145deg,var(--panel),#0c1930);border:1px solid var(--border);border-radius:18px;padding:24px}.card h3,.step h3{margin:8px 0;font-size:1.2rem}.card p,.step p{color:var(--muted);margin:0}.symbol{font-size:1.8rem}.steps{display:grid;gap:16px}.step{display:grid;grid-template-columns:48px 1fr;gap:16px}.number{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#1a447d;color:#a9d2ff;font:1.4rem Funkin,system-ui}.step h3{margin-top:0}.code{position:relative;background:#060d1c;border:1px solid #36527c;border-radius:12px;padding:16px;overflow:auto;margin-top:13px}.code code{white-space:pre;font:14px/1.6 ui-monospace,Consolas,monospace;color:#cbe4ff}.copy{position:absolute;right:8px;top:8px;border:1px solid #426eae;background:#193961;color:white;border-radius:8px;padding:5px 10px;cursor:pointer}.callout strong{color:var(--blue)}.checklist{padding-left:22px;color:var(--muted)}.checklist li{margin:9px 0}.footer{border-top:1px solid var(--border);padding:30px 0;color:var(--muted);text-align:center}.footer a{margin:0 7px}::selection{background:#3568a7;color:white}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.doc{padding-top:55px}.doc article{margin-bottom:20px}.doc p,.doc li{color:var(--muted)}.doc pre{overflow:auto}.doc h2{font-size:1.65rem}@media(max-width:760px){.nav{align-items:flex-start}.links{gap:12px}.hero{padding:65px 0 35px}.grid{grid-template-columns:1fr}.step{grid-template-columns:38px 1fr;padding:18px}.number{width:35px;height:35px}.links a{font-size:.82rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.doc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.doc-card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:24px}.doc-card h2{font-size:1.3rem}.doc-card p{color:var(--muted)}.doc-list{padding-left:24px;color:var(--muted)}.doc-list li{margin:10px 0}.doc-hero{padding:68px 0 25px}.doc-hero h1{font-size:clamp(2.3rem,6vw,4.2rem);margin:14px 0}.doc-hero p{max-width:730px;color:var(--muted)}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em}.note{background:#132b4c;border-left:4px solid var(--blue);padding:16px 20px;border-radius:8px;color:var(--muted)}@media(max-width:760px){.doc-grid{grid-template-columns:1fr}}</style><style>
.music-control{display:inline-flex;align-items:center;gap:8px;border:1px solid #426eae;background:#15284b;color:#edf5ff;border-radius:12px;padding:9px 12px;cursor:pointer;font:inherit;font-size:.9rem}.music-control:hover{background:#214476}.music-control[aria-pressed="true"]{border-color:#58a6ff;background:#1c467a}.community{padding:22px 0 10px;text-align:center}.community p{color:var(--muted)}.discord-link{display:inline-block;background:#5865f2;color:white!important;text-decoration:none;border-radius:12px;padding:12px 22px;font-weight:700}.discord-link:hover{background:#4752c4}.footer .discord-link{margin:8px 0 18px}
</style></head><body><header class="top"><nav aria-label="Navigation" class="wrap nav"><a class="brand" href="../index.html">V <span>Contribution</span></a><div class="links"><a data-i18n="home" href="../index.html"></a><a data-i18n="programming" href="programming.html"></a><a data-i18n="playtesting" href="playtesting.html"></a><a data-i18n="reporting" href="reporting.html"></a><button aria-label="Toggle background music" aria-pressed="false" class="music-control" id="music-toggle" type="button">♫ Music: Off</button><div class="settings"><button aria-controls="settings-menu" aria-expanded="false" aria-label="Language settings" class="gear" id="gear" type="button">⚙</button><div class="menu" hidden="" id="settings-menu"><label data-i18n="language" for="language"></label><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select></div></div></div></nav></header><main class="wrap"><div class="doc-hero"><span class="eyebrow" data-i18n="tag"></span><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div><div class="doc-grid" id="sections"></div><section><div class="note" data-i18n="note"></div><p style="margin-top:24px"><a class="button" data-i18n="cta" href="https://github.com/VConverterCrew/V-Converter/issues/new" id="cta"></a></p></section></main><footer class="footer"><div class="community"><h2 data-extra="discordTitle">Join our community</h2><p data-extra="discordDesc">Join the V-Converter Discord server!</p><a class="discord-link" data-extra="discordButton" href="https://discord.gg/gYrQvGYXCY" rel="noopener noreferrer" target="_blank">Join Discord</a></div><a data-i18n="home" href="../index.html"></a> · <a href="https://github.com/VConverterCrew/V-Converter">V-Converter</a> · <a href="https://github.com/VConverterCrew/V-Contribution">V-Contribution</a></footer><script>const translations={"pt": {"tag": "GUIA DE PLAYTESTING", "title": "Teste o V-Converter", "intro": "Ajude a identificar problemas antes que cheguem a mais pessoas. Registre o ambiente, os passos e o resultado de cada teste.", "sections": [["1. Prepare o ambiente", ["Use uma versão identificável do aplicativo (versão, commit ou build).", "Anote o sistema operacional, versão e dispositivo.", "Faça backup de arquivos importantes e use dados de teste quando possível."]], ["2. Execute os testes", ["Abra o aplicativo e confira a navegação principal.", "Experimente as funções de conversão com arquivos de teste válidos.", "Teste entradas inválidas e verifique mensagens de erro.", "Confira se os arquivos de saída estão corretos e completos.", "Quando possível, repita em outra plataforma."]], ["3. Registre os resultados", ["Marque cada caso como passou, falhou ou não testado.", "Anote passos exatos, resultado esperado e resultado observado.", "Inclua logs ou capturas sem expor informações privadas."]], ["4. Compartilhe com a equipe", ["Pesquise Issues semelhantes antes de criar uma nova.", "Abra uma Issue para cada problema independente.", "Indique a versão testada e a gravidade observada."]]], "note": "Importante: não presuma que um recurso funciona em todas as plataformas só porque passou em uma delas.", "cta": "Abrir Issues", "home": "Início", "programming": "Programação", "playtesting": "Playtesting", "reporting": "Reportar bugs", "language": "Idioma"}, "en": {"tag": "PLAYTESTING GUIDE", "title": "Test V-Converter", "intro": "Help catch problems before they affect more people. Record the environment, steps, and outcome of each test.", "sections": [["1. Prepare your environment", ["Use an identifiable app version (release, commit, or build).", "Record your operating system, version, and device.", "Back up important files and use test data when possible."]], ["2. Run the tests", ["Launch the app and check the main navigation.", "Try conversion features with valid sample files.", "Test invalid inputs and check error messages.", "Verify output files are complete and correct.", "Repeat on another platform if possible."]], ["3. Record results", ["Mark each case as passed, failed, or not tested.", "Write exact steps, expected result, and actual result.", "Attach logs or screenshots without private information."]], ["4. Share with the team", ["Search for similar Issues before creating a new one.", "Open a separate Issue for each independent problem.", "Mention the tested version and observed severity."]]], "note": "Important: a feature passing on one platform does not mean it works on every platform.", "cta": "Open Issues", "home": "Home", "programming": "Programming", "playtesting": "Playtesting", "reporting": "Report bugs", "language": "Language"}, "es": {"tag": "GUÍA DE PRUEBAS", "title": "Prueba V-Converter", "intro": "Ayuda a detectar problemas antes de que afecten a más personas. Registra el entorno, los pasos y el resultado de cada prueba.", "sections": [["1. Prepara el entorno", ["Usa una versión identificable de la aplicación (versión, commit o compilación).", "Anota el sistema operativo, la versión y el dispositivo.", "Haz copias de seguridad y usa datos de prueba cuando sea posible."]], ["2. Realiza las pruebas", ["Abre la aplicación y comprueba la navegación principal.", "Prueba las funciones de conversión con archivos válidos.", "Prueba entradas no válidas y comprueba los mensajes de error.", "Verifica que los archivos de salida estén completos y correctos.", "Repite en otra plataforma si es posible."]], ["3. Registra los resultados", ["Marca cada caso como aprobado, fallido o no probado.", "Escribe los pasos exactos y los resultados esperado y real.", "Adjunta registros o capturas sin información privada."]], ["4. Comparte con el equipo", ["Busca Issues similares antes de crear una nueva.", "Abre una Issue distinta para cada problema independiente.", "Indica la versión probada y la gravedad observada."]]], "note": "Importante: que una función pase en una plataforma no significa que funcione en todas.", "cta": "Abrir Issues", "home": "Inicio", "programming": "Programación", "playtesting": "Pruebas", "reporting": "Reportar errores", "language": "Idioma"}};
const selector=document.querySelector('#language'),gear=document.querySelector('#gear'),menu=document.querySelector('#settings-menu');
function setLanguage(lang){if(!translations[lang])lang='pt';selector.value=lang;document.documentElement.lang=lang==='pt'?'pt-BR':lang;const dict=translations[lang];document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=dict[el.dataset.i18n]||'');const area=document.querySelector('#sections');area.replaceChildren();dict.sections.forEach(([heading,items])=>{const article=document.createElement('article');article.className='doc-card';const h=document.createElement('h2');h.textContent=heading;const ul=document.createElement('ul');ul.className='doc-list';items.forEach(item=>{const li=document.createElement('li');li.textContent=item;ul.append(li)});article.append(h,ul);area.append(article)});try{localStorage.setItem('vcontribution-language',lang)}catch{}}
gear.addEventListener('click',()=>{menu.hidden=!menu.hidden;gear.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',event=>{if(!event.target.closest('.settings')){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.hidden=true;gear.setAttribute('aria-expanded','false')}});selector.addEventListener('change',()=>setLanguage(selector.value));let saved;try{saved=localStorage.getItem('vcontribution-language')}catch{}setLanguage(saved||((navigator.language||'pt').slice(0,2)));</script><audio id="site-music" loop="True" preload="none"><source src="../assets/music/funkin.ogg" type="audio/ogg"/></audio></body></html>
